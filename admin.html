<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shadow Anime Hindi - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #08080d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .box {
      background: #12121b;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 1px solid #242432;
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      background: #090910;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .danger {
      background: #dc2626;
    }

    .hidden {
      display: none;
    }

    .item {
      background: #090910;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .game-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
      display: block;
    }

    .game-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .game-description {
      color: #bbb;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .game-url {
      color: #aaa;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin: 5px 0 15px;
      display: none;
    }

    .logout {
      background: #333;
      margin-left: 8px;
    }

    .info {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <h1>🔐 Admin Panel</h1>

    <p>Enter your admin password.</p>

    <input
      id="passwordInput"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button id="loginButton">Login</button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div class="box hidden" id="dashboard">

    <h1>🎮 Admin Dashboard</h1>

    <p class="info">
      Add your game name, description, game link and thumbnail below.
    </p>

    <h2>Add a Game</h2>


    <!-- GAME NAME -->
    <label>Game Name</label>

    <input
      id="gameName"
      type="text"
      placeholder="Example: Shadow Fight"
    >


    <!-- DESCRIPTION -->
    <label>Description</label>

    <textarea
      id="gameDescription"
      placeholder="Short description of the game"
    ></textarea>


    <!-- GAME URL -->
    <label>Game URL</label>

    <input
      id="gameUrl"
      type="url"
      placeholder="https://example.com/game"
    >


    <!-- GAME IMAGE -->
    <label>Game Thumbnail</label>

    <input
      id="gameImage"
      type="file"
      accept="image/png, image/jpeg, image/webp"
    >

    <p class="info">
      Recommended: JPG, PNG or WEBP. Maximum size: 2 MB.
    </p>

    <!-- IMAGE PREVIEW -->
    <img
      id="imagePreview"
      class="image-preview"
      alt="Game thumbnail preview"
    >


    <!-- ADD GAME BUTTON -->
    <button id="addGameButton">
      ➕ Add Game
    </button>

    <div id="addMessage" class="message"></div>

  </div>


  <!-- GAME LIST -->
  <div class="box hidden" id="gamesBox">

    <h2>📋 Games</h2>

    <div id="gameList"></div>

  </div>

</div>


<script>

/*
 * =====================================
 * ADMIN SETTINGS
 * =====================================
 *
 * CHANGE THIS PASSWORD!
 *
 * IMPORTANT:
 * This is NOT a secure server-side
 * password because this website uses
 * only HTML/JavaScript.
 */

const ADMIN_PASSWORD = "CHANGE_THIS_PASSWORD";


/*
 * =====================================
 * ELEMENTS
 * =====================================
 */

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const gamesBox =
  document.getElementById("gamesBox");


const passwordInput =
  document.getElementById("passwordInput");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");


const gameName =
  document.getElementById("gameName");

const gameDescription =
  document.getElementById("gameDescription");

const gameUrl =
  document.getElementById("gameUrl");

const gameImage =
  document.getElementById("gameImage");

const imagePreview =
  document.getElementById("imagePreview");


const addGameButton =
  document.getElementById("addGameButton");

const addMessage =
  document.getElementById("addMessage");

const gameList =
  document.getElementById("gameList");


/*
 * =====================================
 * STORAGE
 * =====================================
 */

const STORAGE_KEY = "sah_games";


function getGames() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return [];
    }

    const games =
      JSON.parse(saved);

    return Array.isArray(games)
      ? games
      : [];

  } catch (error) {

    console.error(
      "Could not read games:",
      error
    );

    return [];

  }

}


function saveGames(games) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(games)
  );

}


/*
 * =====================================
 * IMAGE PREVIEW
 * =====================================
 */

gameImage.addEventListener(
  "change",
  function() {

    const file =
      gameImage.files[0];

    if (!file) {

      imagePreview.style.display =
        "none";

      imagePreview.src = "";

      return;
    }


    /*
     * Check file size
     */

    if (file.size > 2 * 1024 * 1024) {

      addMessage.textContent =
        "❌ Image must be smaller than 2 MB.";

      gameImage.value = "";

      imagePreview.style.display =
        "none";

      return;
    }


    /*
     * Show preview
     */

    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        imagePreview.src =
          event.target.result;

        imagePreview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/*
 * =====================================
 * LOGIN
 * =====================================
 */

function login() {

  const password =
    passwordInput.value;


  if (password === ADMIN_PASSWORD) {

    loginBox.classList.add("hidden");

    dashboard.classList.remove("hidden");

    gamesBox.classList.remove("hidden");

    loginMessage.textContent = "";

    renderGames();

  } else {

    loginMessage.textContent =
      "❌ Wrong password.";

    passwordInput.value = "";

    passwordInput.focus();

  }

}


loginButton.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      login();

    }

  }
);


/*
 * =====================================
 * ADD GAME
 * =====================================
 */

function addGame() {

  const name =
    gameName.value.trim();

  const description =
    gameDescription.value.trim();

  const url =
    gameUrl.value.trim();

  const imageFile =
    gameImage.files[0];


  /*
   * Validate name and URL
   */

  if (!name || !url) {

    addMessage.textContent =
      "❌ Please enter both the game name and URL.";

    return;

  }


  /*
   * Validate URL
   */

  if (!/^https?:\/\//i.test(url)) {

    addMessage.textContent =
      "❌ URL must start with https:// or http://";

    return;

  }


  /*
   * Require image
   */

  if (!imageFile) {

    addMessage.textContent =
      "❌ Please select a game thumbnail.";

    return;

  }


  /*
   * Validate image size
   */

  if (imageFile.size > 2 * 1024 * 1024) {

    addMessage.textContent =
      "❌ Image must be smaller than 2 MB.";

    return;

  }


  /*
   * Read image
   */

  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      const games =
        getGames();


      /*
       * Create new game
       */

      const newGame = {

        id: Date.now(),

        name: name,

        desc: description,

        url: url,

        image: event.target.result

      };


      games.push(newGame);


      /*
       * Save game
       */

      try {

        saveGames(games);

      } catch (error) {

        console.error(error);

        addMessage.textContent =
          "❌ Storage is full. Try a smaller image.";

        return;

      }


      /*
       * Clear form
       */

      gameName.value = "";

      gameDescription.value = "";

      gameUrl.value = "";

      gameImage.value = "";


      /*
       * Clear preview
       */

      imagePreview.src = "";

      imagePreview.style.display =
        "none";


      /*
       * Success message
       */

      addMessage.textContent =
        "✅ Game added successfully!";


      /*
       * Refresh game list
       */

      renderGames();

    };


  reader.readAsDataURL(imageFile);

}


addGameButton.addEventListener(
  "click",
  addGame
);


/*
 * =====================================
 * DELETE GAME
 * =====================================
 */

function deleteGame(index) {

  const games =
    getGames();


  if (
    index < 0 ||
    index >= games.length
  ) {

    return;

  }


  const game =
    games[index];


  const confirmed =
    confirm(
      'Delete "' +
      game.name +
      '"?'
    );


  if (!confirmed) {

    return;

  }


  games.splice(
    index,
    1
  );


  saveGames(games);


  renderGames();

}


/*
 * =====================================
 * DISPLAY GAMES
 * =====================================
 */

function renderGames() {

  const games =
    getGames();


  /*
   * No games
   */

  if (games.length === 0) {

    gameList.innerHTML =
      "<p>No games added yet.</p>";

    return;

  }


  /*
   * Clear old list
   */

  gameList.innerHTML = "";


  /*
   * Display every game
   */

  games.forEach(
    function(game, index) {

      const item =
        document.createElement("div");

      item.className =
        "item";


      /*
       * IMAGE
       */

      if (game.image) {

        const image =
          document.createElement("img");

        image.className =
          "game-image";

        image.src =
          game.image;

        image.alt =
          game.name;

        item.appendChild(image);

      }


      /*
       * NAME
       */

      const name =
        document.createElement("div");

      name.className =
        "game-name";

      name.textContent =
        game.name;


      /*
       * DESCRIPTION
       */

      const description =
        document.createElement("div");

      description.className =
        "game-description";

      description.textContent =
        game.desc ||
        "No description";


      /*
       * URL
       */

      const url =
        document.createElement("div");

      url.className =
        "game-url";

      url.textContent =
        game.url;


      /*
       * DELETE BUTTON
       */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "danger";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.addEventListener(
        "click",
        function() {

          deleteGame(index);

        }
      );


      /*
       * Add everything
       */

      item.appendChild(name);

      item.appendChild(description);

      item.appendChild(url);

      item.appendChild(deleteButton);


      gameList.appendChild(item);

    }
  );

}

</script>

</body>
</html>
