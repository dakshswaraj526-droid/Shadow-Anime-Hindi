<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Anime Hindi - Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #08080d;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

.box {
    background: #12121b;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    border: 1px solid #242432;
}

h1,
h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 14px;
    background: #090910;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.danger {
    background: #dc2626;
}

.logout {
    background: #333;
}

.hidden {
    display: none;
}

.item {
    background: #090910;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.game-image {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 15px;
    display: block;
}

.game-name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.game-description {
    color: #bbb;
    margin-bottom: 12px;
    line-height: 1.5;
}

.game-url {
    color: #aaa;
    word-break: break-all;
    margin-bottom: 12px;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

.info {
    color: #888;
    font-size: 13px;
    line-height: 1.5;
}

.preview {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 8px;
    margin: 5px 0 15px;
    display: none;
}

hr {
    border: 0;
    border-top: 1px solid #333;
    margin: 25px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div class="box" id="loginBox">

    <h1>🔐 Admin Panel</h1>

    <p>Login with your Firebase admin account.</p>

    <label>Email</label>

    <input
        id="emailInput"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
    >

    <label>Password</label>

    <input
        id="passwordInput"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
    >

    <button id="loginButton">
        Login
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<div class="box hidden" id="dashboard">

    <h1>🎮 Admin Dashboard</h1>

    <p class="info">
        Add your game name, description, game link and thumbnail.
    </p>

    <button id="logoutButton" class="logout">
        Logout
    </button>

    <hr>

    <h2>➕ Add a Game</h2>

    <!-- GAME NAME -->

    <label>Game Name</label>

    <input
        id="gameName"
        type="text"
        placeholder="Example: Shadow Fight"
    >


    <!-- DESCRIPTION -->

    <label>Description</label>

    <textarea
        id="gameDescription"
        placeholder="Short description of the game"
    ></textarea>


    <!-- GAME URL -->

    <label>Game URL</label>

    <input
        id="gameUrl"
        type="url"
        placeholder="https://example.com/game"
    >


    <!-- IMAGE URL -->

    <label>Game Thumbnail URL</label>

    <input
        id="gameImageUrl"
        type="url"
        placeholder="https://example.com/image.jpg"
    >

    <p class="info">
        Paste a direct image URL ending in .jpg, .jpeg, .png or .webp.
    </p>


    <!-- PREVIEW -->

    <img
        id="imagePreview"
        class="preview"
        alt="Game preview"
    >


    <!-- ADD -->

    <button id="addGameButton">
        ➕ Add Game
    </button>

    <div id="addMessage" class="message"></div>

</div>


<!-- ========================= -->
<!-- GAMES -->
<!-- ========================= -->

<div class="box hidden" id="gamesBox">

    <h2>📋 Games</h2>

    <div id="gameList"></div>

</div>

</div>


<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// ========================================
// YOUR FIREBASE CONFIGURATION
// ========================================

const firebaseConfig = {

    apiKey: "AIzaSyBxQKD4WGBT_RLsm5yTA3wIk-x2hvukv_E",

    authDomain:
        "shadow-anime-hindi.firebaseapp.com",

    projectId:
        "shadow-anime-hindi",

    storageBucket:
        "shadow-anime-hindi.firebasestorage.app",

    messagingSenderId:
        "667892417939",

    appId:
        "1:667892417939:web:fb2a5e7396ed156ed75466",

    measurementId:
        "G-16NHE5CYMG"
};


// ========================================
// INITIALIZE FIREBASE
// ========================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// ========================================
// ELEMENTS
// ========================================

const loginBox =
    document.getElementById("loginBox");

const dashboard =
    document.getElementById("dashboard");

const gamesBox =
    document.getElementById("gamesBox");

const emailInput =
    document.getElementById("emailInput");

const passwordInput =
    document.getElementById("passwordInput");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");

const logoutButton =
    document.getElementById("logoutButton");

const gameName =
    document.getElementById("gameName");

const gameDescription =
    document.getElementById("gameDescription");

const gameUrl =
    document.getElementById("gameUrl");

const gameImageUrl =
    document.getElementById("gameImageUrl");

const imagePreview =
    document.getElementById("imagePreview");

const addGameButton =
    document.getElementById("addGameButton");

const addMessage =
    document.getElementById("addMessage");

const gameList =
    document.getElementById("gameList");


// ========================================
// IMAGE PREVIEW
// ========================================

gameImageUrl.addEventListener(
    "input",
    function() {

        const url =
            gameImageUrl.value.trim();

        if (!url) {

            imagePreview.style.display =
                "none";

            imagePreview.src = "";

            return;
        }

        imagePreview.src = url;

        imagePreview.style.display =
            "block";
    }
);


// If image URL fails

imagePreview.addEventListener(
    "error",
    function() {

        imagePreview.style.display =
            "none";

    }
);


// ========================================
// LOGIN
// ========================================

async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        loginMessage.textContent =
            "❌ Enter your email and password.";

        return;
    }


    loginButton.disabled = true;

    loginMessage.textContent =
        "⏳ Logging in...";


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        loginMessage.textContent =
            "✅ Login successful!";


    } catch (error) {

        console.error(error);

        loginMessage.textContent =
            "❌ " + getFirebaseError(error);

    }


    loginButton.disabled = false;
}


loginButton.addEventListener(
    "click",
    login
);


// Press Enter to login

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);


// ========================================
// FIREBASE ERROR
// ========================================

function getFirebaseError(error) {

    if (
        error.code ===
        "auth/invalid-credential"
    ) {

        return "Incorrect email or password.";

    }

    if (
        error.code ===
        "auth/user-not-found"
    ) {

        return "No account found with this email.";

    }

    if (
        error.code ===
        "auth/wrong-password"
    ) {

        return "Incorrect password.";

    }

    if (
        error.code ===
        "auth/invalid-email"
    ) {

        return "Invalid email address.";

    }

    if (
        error.code ===
        "auth/too-many-requests"
    ) {

        return "Too many attempts. Try again later.";

    }

    return error.message || "Login failed.";

}


// ========================================
// LOGOUT
// ========================================

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            await signOut(auth);

        } catch (error) {

            console.error(error);

        }

    }
);


// ========================================
// AUTH STATE
// ========================================

onAuthStateChanged(
    auth,
    function(user) {

        if (user) {

            loginBox.classList.add("hidden");

            dashboard.classList.remove("hidden");

            gamesBox.classList.remove("hidden");

            renderGames();

        } else {

            loginBox.classList.remove("hidden");

            dashboard.classList.add("hidden");

            gamesBox.classList.add("hidden");

        }

    }
);


// ========================================
// ADD GAME
// ========================================

async function addGame() {

    const name =
        gameName.value.trim();

    const description =
        gameDescription.value.trim();

    const url =
        gameUrl.value.trim();

    const imageUrl =
        gameImageUrl.value.trim();


    // CHECK NAME

    if (!name) {

        addMessage.textContent =
            "❌ Please enter the game name.";

        return;
    }


    // CHECK GAME URL

    if (!url) {

        addMessage.textContent =
            "❌ Please enter the game URL.";

        return;
    }


    if (!/^https?:\/\//i.test(url)) {

        addMessage.textContent =
            "❌ Game URL must start with http:// or https://";

        return;
    }


    // CHECK IMAGE URL

    if (!imageUrl) {

        addMessage.textContent =
            "❌ Please enter the thumbnail URL.";

        return;
    }


    if (!/^https?:\/\//i.test(imageUrl)) {

        addMessage.textContent =
            "❌ Thumbnail URL must start with http:// or https://";

        return;
    }


    addGameButton.disabled = true;

    addMessage.textContent =
        "⏳ Saving game...";


    try {

        const user =
            auth.currentUser;


        if (!user) {

            throw new Error(
                "You are not logged in."
            );

        }


        // =================================
        // SAVE GAME TO FIRESTORE
        // =================================

        await addDoc(
            collection(db, "games"),
            {

                name: name,

                description:
                    description,

                url: url,

                imageUrl:
                    imageUrl,

                createdAt:
                    Date.now(),

                createdBy:
                    user.uid
            }
        );


        // =================================
        // CLEAR FORM
        // =================================

        gameName.value = "";

        gameDescription.value = "";

        gameUrl.value = "";

        gameImageUrl.value = "";

        imagePreview.src = "";

        imagePreview.style.display =
            "none";


        addMessage.textContent =
            "✅ Game added successfully!";


        renderGames();


    } catch (error) {

        console.error(error);

        addMessage.textContent =
            "❌ " +
            getFirebaseError(error);

    }


    addGameButton.disabled = false;

}


addGameButton.addEventListener(
    "click",
    addGame
);


// ========================================
// DELETE GAME
// ========================================

async function deleteGame(
    gameId,
    gameNameText
) {

    const confirmed =
        confirm(
            'Delete "' +
            gameNameText +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    try {

        // =================================
        // DELETE FIRESTORE DOCUMENT ONLY
        // =================================

        await deleteDoc(
            doc(
                db,
                "games",
                gameId
            )
        );


        renderGames();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not delete game: " +
            error.message
        );

    }

}


// ========================================
// LOAD GAMES
// ========================================

async function renderGames() {

    gameList.innerHTML =
        "<p>⏳ Loading games...</p>";


    try {

        const gamesQuery =
            query(
                collection(db, "games"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                gamesQuery
            );


        if (snapshot.empty) {

            gameList.innerHTML =
                "<p>No games added yet.</p>";

            return;
        }


        gameList.innerHTML = "";


        snapshot.forEach(
            function(documentSnapshot) {

                const game =
                    documentSnapshot.data();

                const id =
                    documentSnapshot.id;


                // =================================
                // ITEM
                // =================================

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "item";


                // =================================
                // IMAGE
                // =================================

                if (game.imageUrl) {

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "game-image";

                    image.src =
                        game.imageUrl;

                    image.alt =
                        game.name || "Game";

                    item.appendChild(image);

                }


                // =================================
                // NAME
                // =================================

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "game-name";

                name.textContent =
                    game.name ||
                    "Unnamed game";


                // =================================
                // DESCRIPTION
                // =================================

                const description =
                    document.createElement(
                        "div"
                    );

                description.className =
                    "game-description";

                description.textContent =
                    game.description ||
                    "No description";


                // =================================
                // URL
                // =================================

                const url =
                    document.createElement(
                        "div"
                    );

                url.className =
                    "game-url";

                url.textContent =
                    game.url || "";


                // =================================
                // DELETE BUTTON
                // =================================

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "danger";

                deleteButton.textContent =
                    "🗑️ Delete";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteGame(
                            id,
                            game.name
                        );

                    }
                );


                // =================================
                // ADD EVERYTHING
                // =================================

                item.appendChild(name);

                item.appendChild(
                    description
                );

                item.appendChild(url);

                item.appendChild(
                    deleteButton
                );

                gameList.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        gameList.innerHTML =
            "<p>❌ Could not load games: " +
            error.message +
            "</p>";

    }

}

</script>

</body>
</html>
