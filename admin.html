<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#08080d;color:white;font-family:Arial;padding:25px}.box{max-width:650px;margin:auto;background:#12121b;padding:25px;border-radius:15px}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;background:#090910;color:white;border:1px solid #333;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;background:#8b4dff;color:white;font-weight:bold}.danger{background:#b33}.hidden{display:none}.item{border:1px solid #333;padding:15px;margin:12px 0;border-radius:9px}</style></head><body><div class="box"><h1>🔐 Admin Panel</h1><div id="login"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="dash" class="hidden"><h2>Add a game</h2><input id="name" placeholder="Game name"><textarea id="desc" placeholder="Short description"></textarea><input id="url" placeholder="Official/legal game link (https://...)"><button onclick="add()">Add Game</button><h2>Games</h2><div id="list"></div></div></div><script>const PASSWORD='CHANGE_THIS_PASSWORD';function login(){if(pw.value===PASSWORD){login.style.display='none';dash.classList.remove('hidden');render()}else alert('Wrong password')}function get(){return JSON.parse(localStorage.getItem('sah_games')||'[]')}function add(){if(!name.value||!url.value)return alert('Enter name and link');if(!/^https?:\\/\\//i.test(url.value))return alert('Use https://');let a=get();a.push({name:name.value,description:desc.value,url:url.value});localStorage.setItem('sah_games',JSON.stringify(a));name.value=desc.value=url.value='';render()}function del(i){let a=get();a.splice(i,1);localStorage.setItem('sah_games',JSON.stringify(a));render()}function render(){let a=get();list.innerHTML=a.map((g,i)=>`<div class="item"><b>${g.name}</b><br>${g.url}<br><button class="danger" onclick="del(${i})">Delete</button></div>`).join('')||'<p>No games added.</p>'}</script></body></html>
