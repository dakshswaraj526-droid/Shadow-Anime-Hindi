<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Anime Hindi</title><style>body{margin:0;background:#08080d;color:white;font-family:Arial}header,section{padding:25px 7%}header{background:#11111a;position:sticky;top:0}h1{font-size:48px}h1,b{color:#a45cff}.hero{text-align:center;padding:80px 7%;background:radial-gradient(circle,#291354,#08080d 60%)}.btn{display:inline-block;background:#8b4dff;color:white;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#12121b;border:1px solid #29293a;border-radius:15px;padding:20px}.card p{color:#aaa}footer{text-align:center;padding:30px;color:#777}</style></head><body><header><b>Shadow Anime Hindi</b></header><div class="hero"><h1>Shadow Anime Hindi</h1><p>Anime • Gaming • Entertainment</p><a class="btn" href="https://youtube.com/@shadowanimehindi001" target="_blank">▶ Visit YouTube</a></div><section><h2>🎮 Game Downloads</h2><div id="games" class="grid"></div></section><footer>© 2026 Shadow Anime Hindi</footer><script>let a=JSON.parse(localStorage.getItem('sah_games')||'[]');document.getElementById('games').innerHTML=a.length?a.map(g=>`<div class="card"><h3>🎮 ${g.name}</h3><p>${g.description||''}</p><a class="btn" href="${g.url}" target="_blank">📥 Download / Open</a></div>`).join(''):'<div class="card"><h3>No games yet</h3><p>New games will appear here.</p></div>';</script></body></html>
