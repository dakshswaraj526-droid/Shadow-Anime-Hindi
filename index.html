<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Shadow Anime Gaming</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #07070d;
    color: white;
}


/* HEADER */

header {
    height: 75px;
    background: #0d0d16;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid #252538;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #a855f7;
}

nav a {
    color: #bbb;
    text-decoration: none;
    margin-left: 30px;
    transition: 0.3s;
}

nav a:hover {
    color: #a855f7;
}


/* HERO */

.hero {
    min-height: 430px;
    display: flex;
    align-items: center;
    padding: 60px 8%;

    background:
        radial-gradient(
            circle at 80% 50%,
            #581c87 0%,
            transparent 35%
        ),

        linear-gradient(
            90deg,
            #07070d,
            #11101c
        );
}

.hero-text {
    max-width: 650px;
}

.tag {
    color: #a855f7;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

h1 {
    font-size: 55px;
    line-height: 1.05;
    margin-bottom: 20px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.play-btn {
    display: inline-block;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #a855f7
        );

    color: white;

    padding: 15px 35px;

    border-radius: 8px;

    text-decoration: none;

    font-weight: bold;

    box-shadow:
        0 0 25px #7c3aed66;

    transition: 0.3s;
}

.play-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 0 35px #a855f7aa;
}


/* GAMES */

.games {
    padding: 60px 8%;
}

.section-title {
    font-size: 30px;
    margin-bottom: 30px;
}

.game-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 25px;
}


/* GAME CARD */

.game-card {
    background: #10101a;

    border: 1px solid #262638;

    border-radius: 14px;

    overflow: hidden;

    transition: 0.3s;
}

.game-card:hover {
    transform: translateY(-8px);

    border-color: #a855f7;

    box-shadow:
        0 10px 35px #000;
}

.game-card img {
    width: 100%;

    height: 190px;

    object-fit: cover;

    display: block;
}

.game-info {
    padding: 20px;
}

.game-info h2 {
    margin-bottom: 10px;
}

.game-info p {
    color: #999;

    line-height: 1.5;

    margin-bottom: 18px;
}

.card-btn {
    display: inline-block;

    padding: 10px 20px;

    background: #7c3aed;

    color: white;

    text-decoration: none;

    border-radius: 6px;

    font-weight: bold;

    transition: 0.3s;
}

.card-btn:hover {
    background: #a855f7;

    transform: translateY(-2px);
}


/* NO GAMES */

.no-games {
    background: #10101a;

    border: 1px solid #262638;

    padding: 35px;

    border-radius: 12px;

    text-align: center;

    color: #888;
}


/* LOADING */

.loading {
    background: #10101a;

    border: 1px solid #262638;

    padding: 35px;

    border-radius: 12px;

    text-align: center;

    color: #888;
}


/* FOOTER */

footer {
    text-align: center;

    padding: 30px;

    background: #0b0b12;

    color: #666;

    border-top:
        1px solid #20202d;
}


/* MOBILE */

@media(max-width: 700px) {

    header {
        padding: 0 5%;
    }

    nav {
        display: none;
    }

    h1 {
        font-size: 40px;
    }

    .hero {
        padding: 50px 6%;
    }

    .games {
        padding: 45px 6%;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        SHADOW<span>ANIME</span>
    </div>

    <nav>

        <a href="#">
            Home
        </a>

        <a href="#games">
            Games
        </a>

        <a href="#">
            About
        </a>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <div class="hero-text">

        <div class="tag">
            WELCOME TO THE SHADOW
        </div>

        <h1>
            ENTER THE<br>
            ANIME WORLD
        </h1>

        <p>
            Discover and play amazing games from
            the Shadow Anime gaming universe.
            Choose your game and start playing now.
        </p>

        <a
            href="#games"
            class="play-btn"
        >
            🎮 EXPLORE GAMES
        </a>

    </div>

</section>


<!-- GAMES -->

<section
    class="games"
    id="games"
>

    <h2 class="section-title">
        🎮 Featured Games
    </h2>

    <div
        class="game-grid"
        id="gameGrid"
    >

        <div class="loading">
            ⏳ Loading games...
        </div>

    </div>

</section>


<!-- FOOTER -->

<footer>

    © 2026 Shadow Anime Hindi • All Rights Reserved

</footer>


<script type="module">


// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBxQKD4WGRL_RLsm5yTA3wIK-x2hvukv_E",
  authDomain: "shadow-anime-hindi.firebaseapp.com",
  projectId: "shadow-anime-hindi",
  storageBucket: "shadow-anime-hindi.firebasestorage.app",
  messagingSenderId: "667892417939",
  appId: "1:667892417939:web:fb2a5e7396ed156ed75466",
  measurementId: "G-1GN6HE5CYMG"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const firebaseConfig = {

    apiKey:
        "PASTE_YOUR_API_KEY_HERE",

    authDomain:
        "PASTE_YOUR_AUTH_DOMAIN_HERE",

    projectId:
        "PASTE_YOUR_PROJECT_ID_HERE",

    storageBucket:
        "PASTE_YOUR_STORAGE_BUCKET_HERE",

    messagingSenderId:
        "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",

    appId:
        "PASTE_YOUR_APP_ID_HERE"

};


/*
====================================================
FIREBASE IMPORTS
====================================================
*/

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/*
====================================================
INITIALIZE FIREBASE
====================================================
*/

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/*
====================================================
GAME GRID
====================================================
*/

const gameGrid =
    document.getElementById("gameGrid");


/*
====================================================
LOAD GAMES
====================================================
*/

async function getGames() {

    const snapshot =
        await getDocs(
            collection(db, "games")
        );

    const games =
        snapshot.docs.map(
            function(item) {

                return {
                    id: item.id,
                    ...item.data()
                };

            }
        );


    /*
     * Newest games first
     */

    games.sort(
        function(a, b) {

            return (
                (b.createdAt || 0) -
                (a.createdAt || 0)
            );

        }
    );


    return games;

}


/*
====================================================
DISPLAY GAMES
====================================================
*/

async function displayGames() {

    try {

        const games =
            await getGames();


        gameGrid.innerHTML = "";


        /*
         * NO GAMES
         */

        if (games.length === 0) {

            gameGrid.innerHTML = `

                <div class="no-games">

                    🎮 No games available yet.

                    <br><br>

                    Check back soon!

                </div>

            `;

            return;

        }


        /*
         * CREATE GAME CARDS
         */

        games.forEach(
            function(game) {


                const card =
                    document.createElement("div");

                card.className =
                    "game-card";


                /*
                 * IMAGE
                 */

                if (game.image) {

                    const image =
                        document.createElement("img");

                    image.src =
                        game.image;

                    image.alt =
                        game.name;

                    image.loading =
                        "lazy";

                    card.appendChild(image);

                }


                /*
                 * INFO
                 */

                const info =
                    document.createElement("div");

                info.className =
                    "game-info";


                /*
                 * TITLE
                 */

                const title =
                    document.createElement("h2");

                title.textContent =
                    game.name;


                /*
                 * DESCRIPTION
                 */

                const description =
                    document.createElement("p");

                description.textContent =
                    game.desc ||
                    "Experience an amazing gaming adventure.";


                /*
                 * PLAY BUTTON
                 */

                const button =
                    document.createElement("a");

                button.className =
                    "card-btn";

                button.textContent =
                    "PLAY NOW →";

                button.href =
                    game.url;

                button.target =
                    "_blank";

                button.rel =
                    "noopener noreferrer";


                /*
                 * BUILD CARD
                 */

                info.appendChild(title);

                info.appendChild(description);

                info.appendChild(button);

                card.appendChild(info);

                gameGrid.appendChild(card);

            }
        );


    } catch (error) {

        console.error(
            "Could not load games:",
            error
        );


        gameGrid.innerHTML = `

            <div class="no-games">

                ❌ Could not load games.

                <br><br>

                Please try again later.

            </div>

        `;

    }

}


/*
====================================================
START
====================================================
*/

displayGames();

</script>

</body>
</html>
